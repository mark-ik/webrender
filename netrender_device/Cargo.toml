[package]
name = "netrender_device"
version = "0.1.2"
license = "MPL-2.0"
repository = "https://github.com/merely-made/netrender"
readme = "../README.md"
description = "wgpu-native device foundation for netrender: shared device ownership, typed image execution, surfaces, and pipelines."
edition = "2021"

[features]
default = []
# Roadmap A2 — Scene capture / replay support. Adds serde derives to
# the netrender_device types embedded in `netrender::scene::Scene`
# (`SurfaceKey`, `GradientKind`). Pulled in transitively by
# `netrender`'s matching `serde` feature.
serde = ["dep:serde"]

[dependencies]
log.workspace = true
wgpu = { workspace = true, features = ["std", "parking_lot", "wgsl"] }
serde = { workspace = true, optional = true }

# Backend features are per-target: native gets the platform backends,
# wasm32 gets the WebGPU backend. The blocking `boot()` wrappers (and
# their pollster dep) are native-only; wasm consumers drive `boot_async`
# from a browser executor.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["dx12", "metal", "vulkan"] }
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }
web-time = "1"
